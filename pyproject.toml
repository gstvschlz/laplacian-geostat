[project]
name = "lapgeo"
version = "0.1.0"
description = "What the Laplacian is in geostatistical estimation and simulation, with checks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "scipy>=1.13", "matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lapgeo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
